# Manifestos Kubernetes do billing-service (Fase 4).
# Em EKS o deploy é feito pelo Terraform em infra/ (mesmos recursos, com
# valores reais de banco/fila/secret); estes YAMLs documentam a topologia e
# são validados no CI (kubeconform). Para aplicar manualmente:
#   kubectl apply -f k8s/
---
apiVersion: batch/v1
kind: Job
metadata:
  name: billing-migrate
  namespace: billing
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: migrate
          image: ghcr.io/vinnytechdevelopment/billing-service-fiap:latest
          args: ["php", "artisan", "migrate", "--force"]
          envFrom:
            - configMapRef:
                name: billing-config
            - secretRef:
                name: billing-secret
